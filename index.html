<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weather dashboard app for checking current weather conditions by city." />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <main class="weather-page">
      <div class="weather-card">
        <p class="eyebrow">Live conditions</p>
        <h1>Weather Dashboard</h1>

        <form id="weatherForm" class="weather-form" novalidate>
          <label class="sr-only" for="cityInput">City name</label>
          <div class="input-row">
            <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off" />
            <button type="submit">Get Weather</button>
          </div>
        </form>

        <div id="status" class="status" aria-live="polite"></div>
        <section id="weatherResult" class="weather-result" aria-live="polite"></section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
